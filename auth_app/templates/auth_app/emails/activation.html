<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your email</title>
</head>
<body style="margin:0;background:#f5f6fa;color:#4a4a4a;font-family:Arial,sans-serif">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f6fa">
    <tr>
      <td align="center" style="padding:40px 16px">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:700px;background:#fff;border-radius:16px">
          <tr>
            <td style="padding:48px 40px">
              <div style="text-align:center;margin-bottom:40px">
                <span style="color:#6c21ff;font-size:38px;font-weight:900;vertical-align:middle">&#10148;</span>
                <span style="color:#5928ff;font-size:32px;font-weight:900;letter-spacing:-2px;vertical-align:middle">VIDEOFLIX</span>
              </div>
              <p style="margin:0 0 12px;font-size:18px;line-height:1.6">Dear {{ user.email }},</p>
              <p style="margin:0 0 28px;font-size:18px;line-height:1.6">
                Thank you for registering with <span style="color:#3547ff">Videoflix</span>.
                To complete your registration and verify your email address, please click the button below:
              </p>
              <p style="margin:0 0 30px">
                <a href="{{ action_url }}" style="display:inline-block;padding:16px 28px;background:#3547ff;color:#fff;font-size:18px;font-weight:700;text-decoration:none;border-radius:28px">Activate account</a>
              </p>
              <p style="margin:0 0 28px;font-size:17px;line-height:1.6">If you did not create an account with us, please disregard this email.</p>
              <p style="margin:0;font-size:17px;line-height:1.7">Best regards,<br><br>Your Videoflix Team</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
